name: vulkan-verification

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    paths:
      - '.github/workflows/vulkan-verification.yml'
      - 'meson.build'
      - 'meson_options.txt'
      - 'code/client/cl_cgame.cpp'
      - 'code/renderercommon/**'
      - 'code/rendererrtx/**'
      - 'code/renderervk/**'
      - 'code/win32/win_glimp.cpp'
      - 'docs/RTX.md'
      - 'docs/SCREENSHOTS.md'
      - 'docs/fnquake3/FOG_RENDERING.md'
      - 'docs/fnquake3/LIQUID_RENDERING.md'
      - 'docs/fnquake3/RTX_*.md'
      - 'docs/fnquake3/TECHNICAL.md'
      - 'docs/fnquake3/VK_*.md'
      - 'pkg/baseq3/maps/*.fog'
      - 'pkg/missionpack/maps/*.fog'
      - 'scripts/rtx_runtime_smoke.py'
      - 'scripts/vk_runtime_sweep.py'
      - 'scripts/stringify_shader.py'
      - 'tests/global_fog_source_tests.py'
      - 'tests/liquid_interaction_source_tests.py'
      - 'tests/liquid_rendering_source_tests.py'
      - 'tests/renderer_contract_source_tests.py'
      - 'tests/rtx_fog_dlight_source_tests.py'
      - 'tests/rtx_hdr_source_tests.py'
      - 'tests/rtx_light_visibility_source_tests.py'
      - 'tests/rtx_liquid_rendering_source_tests.py'
      - 'tests/rtx_raster_overlay_parity_source_tests.py'
      - 'tests/rtx_renderer_parity_source_tests.py'
      - 'tests/rtx_runtime_smoke_tests.py'
      - 'tests/rtx_surface_light_source_tests.py'
      - 'tests/static_map_lights_source_tests.py'
      - 'tests/vulkan/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vulkan-verification.yml'
      - 'meson.build'
      - 'meson_options.txt'
      - 'code/client/cl_cgame.cpp'
      - 'code/renderercommon/**'
      - 'code/rendererrtx/**'
      - 'code/renderervk/**'
      - 'code/win32/win_glimp.cpp'
      - 'docs/RTX.md'
      - 'docs/SCREENSHOTS.md'
      - 'docs/fnquake3/FOG_RENDERING.md'
      - 'docs/fnquake3/LIQUID_RENDERING.md'
      - 'docs/fnquake3/RTX_*.md'
      - 'docs/fnquake3/TECHNICAL.md'
      - 'docs/fnquake3/VK_*.md'
      - 'pkg/baseq3/maps/*.fog'
      - 'pkg/missionpack/maps/*.fog'
      - 'scripts/rtx_runtime_smoke.py'
      - 'scripts/vk_runtime_sweep.py'
      - 'scripts/stringify_shader.py'
      - 'tests/global_fog_source_tests.py'
      - 'tests/liquid_interaction_source_tests.py'
      - 'tests/liquid_rendering_source_tests.py'
      - 'tests/renderer_contract_source_tests.py'
      - 'tests/rtx_fog_dlight_source_tests.py'
      - 'tests/rtx_hdr_source_tests.py'
      - 'tests/rtx_light_visibility_source_tests.py'
      - 'tests/rtx_liquid_rendering_source_tests.py'
      - 'tests/rtx_raster_overlay_parity_source_tests.py'
      - 'tests/rtx_renderer_parity_source_tests.py'
      - 'tests/rtx_runtime_smoke_tests.py'
      - 'tests/rtx_surface_light_source_tests.py'
      - 'tests/static_map_lights_source_tests.py'
      - 'tests/vulkan/**'
  workflow_dispatch:
    inputs:
      run_runtime_sweep:
        description: Run the selected Vulkan-family gate on a self-hosted GPU runner with retail assets.
        required: true
        default: false
        type: boolean
      runtime_runner_labels:
        description: JSON array of self-hosted runner labels.
        required: true
        default: '["self-hosted","vulkan"]'
        type: string
      runtime_gate:
        description: Vulkan-family RC gate to execute on the runtime runner.
        required: true
        default: vk-smoke
        type: choice
        options:
          - vk-smoke
          - vk-modern
          - vk-hdr
          - rtx-smoke
      runtime_exe:
        description: Path to the built FnQuake3 client executable on the runtime runner.
        required: false
        default: ''
        type: string
      runtime_basepath:
        description: Path containing retail baseq3 assets on the runtime runner.
        required: false
        default: ''
        type: string

jobs:
  vulkan-renderer-build:
    name: Vulkan-family Meson renderer build (${{ matrix.renderer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        renderer:
          - vk
          - rtx
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y meson ninja-build gcc g++ glslang-tools libx11-dev libxext-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev mesa-common-dev

      - name: Verify RTX shader outputs are current
        if: matrix.renderer == 'rtx'
        run: python code/rendererrtx/shaders/build_shaders.py --check

      - name: Run RTX parity source contracts
        if: matrix.renderer == 'rtx'
        run: |
          python tests/rtx_fog_dlight_source_tests.py
          python tests/rtx_hdr_source_tests.py
          python tests/rtx_light_visibility_source_tests.py
          python tests/rtx_liquid_rendering_source_tests.py
          python tests/rtx_raster_overlay_parity_source_tests.py
          python tests/rtx_renderer_parity_source_tests.py
          python tests/rtx_runtime_smoke_tests.py
          python tests/rtx_surface_light_source_tests.py
          python tests/global_fog_source_tests.py
          python tests/liquid_interaction_source_tests.py
          python tests/liquid_rendering_source_tests.py
          python tests/renderer_contract_source_tests.py
          python tests/static_map_lights_source_tests.py

      - name: Configure focused Meson Vulkan-family build
        run: |
          meson setup ".tmp/meson-${{ matrix.renderer }}-verification" \
            --buildtype=debugoptimized \
            -Dsdl=disabled \
            -Dcurl=disabled \
            -Drenderer-dlopen=true \
            -Drenderers=${{ matrix.renderer }} \
            -Dbuild-client=false \
            -Dbuild-server=false \
            -Daudio-tests=false \
            -Dglx-tests=false

      - name: Build Vulkan-family renderer
        run: meson compile -C ".tmp/meson-${{ matrix.renderer }}-verification" "fnquake3_${{ matrix.renderer }}_x86_64"

      - name: Configure static RTX renderer build
        if: matrix.renderer == 'rtx'
        run: |
          meson setup .tmp/meson-rtx-static-verification \
            --buildtype=debugoptimized \
            -Dsdl=disabled \
            -Dcurl=disabled \
            -Drenderer-dlopen=false \
            -Drenderer-default=rtx \
            -Drenderers=rtx \
            -Dbuild-client=false \
            -Dbuild-server=false \
            -Daudio-tests=false \
            -Dglx-tests=false

      - name: Build static RTX renderer
        if: matrix.renderer == 'rtx'
        run: meson compile -C .tmp/meson-rtx-static-verification renderer_static_rtx

      - name: Configure static Vulkan renderer build
        if: matrix.renderer == 'vk'
        run: |
          meson setup .tmp/meson-vk-static-verification \
            --buildtype=debugoptimized \
            -Dsdl=disabled \
            -Dcurl=disabled \
            -Drenderer-dlopen=false \
            -Drenderer-default=vk \
            -Drenderers=vk \
            -Dbuild-client=false \
            -Dbuild-server=false \
            -Daudio-tests=false \
            -Dglx-tests=false

      - name: Build static Vulkan renderer
        if: matrix.renderer == 'vk'
        run: meson compile -C .tmp/meson-vk-static-verification renderer_static_vk

  vulkan-gate-plans:
    name: Vulkan RC gate plans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: List Vulkan RC gates
        run: python scripts/vk_runtime_sweep.py --list-gates

      - name: Run Vulkan sweep Python tests
        run: |
          python tests/vulkan/vk_runtime_sweep_tests.py
          python tests/rtx_runtime_smoke_tests.py

      - name: Generate dry-run Vulkan gate artifacts
        run: |
          mkdir -p .tmp/vk-gate-plans
          for gate in vk-smoke vk-modern vk-hdr; do
            python scripts/vk_runtime_sweep.py \
              --gate "$gate" \
              --dry-run \
              --exe ".tmp/vk-gate-plans/fnquake3" \
              --basepath ".tmp/vk-gate-plans/basepath" \
              --output-dir ".tmp/vk-gate-plans" \
              --summary-markdown ".tmp/vk-gate-plans/${gate}.md"
            cat ".tmp/vk-gate-plans/${gate}.md" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Generate dry-run RTX gate artifacts
        run: |
          mkdir -p .tmp/rtx-gate-plans
          python scripts/rtx_runtime_smoke.py \
            --gate rtx-smoke \
            --dry-run \
            --exe ".tmp/rtx-gate-plans/fnquake3" \
            --basepath ".tmp/rtx-gate-plans/basepath" \
            --output-dir ".tmp/rtx-gate-plans" \
            --summary-markdown ".tmp/rtx-gate-plans/rtx-smoke.md"
          cat ".tmp/rtx-gate-plans/rtx-smoke.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dry-run gate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vulkan-family-gate-plans
          path: |
            .tmp/vk-gate-plans
            .tmp/rtx-gate-plans
          if-no-files-found: error
          retention-days: 14

  vulkan-runtime-sweep:
    name: Vulkan-family runtime sweep
    if: github.event_name == 'workflow_dispatch' && inputs.run_runtime_sweep
    runs-on: ${{ fromJSON(inputs.runtime_runner_labels || '["self-hosted","vulkan"]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate runtime inputs
        shell: python
        env:
          FNQ3_VK_RUNTIME_EXE: ${{ inputs.runtime_exe }}
          FNQ3_VK_RUNTIME_BASEPATH: ${{ inputs.runtime_basepath }}
        run: |
          import os
          import sys

          missing = [
              name
              for name in ("FNQ3_VK_RUNTIME_EXE", "FNQ3_VK_RUNTIME_BASEPATH")
              if not os.environ.get(name)
          ]
          if missing:
              for name in missing:
                  print(f"{name} is required when run_runtime_sweep is true.", file=sys.stderr)
              sys.exit(2)

      - name: Run Vulkan-family runtime gate
        shell: python
        env:
          FNQ3_VK_RUNTIME_GATE: ${{ inputs.runtime_gate }}
          FNQ3_VK_RUNTIME_EXE: ${{ inputs.runtime_exe }}
          FNQ3_VK_RUNTIME_BASEPATH: ${{ inputs.runtime_basepath }}
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          gate = os.environ["FNQ3_VK_RUNTIME_GATE"]
          is_rtx = gate == "rtx-smoke"
          output_dir = Path(".tmp") / (
              "rtx-runtime-smoke" if is_rtx else "vk-runtime-sweeps"
          )
          summary_path = output_dir / f"{gate}.md"
          command = [
              sys.executable,
              (
                  "scripts/rtx_runtime_smoke.py"
                  if is_rtx
                  else "scripts/vk_runtime_sweep.py"
              ),
              "--gate",
              gate,
              "--exe",
              os.environ["FNQ3_VK_RUNTIME_EXE"],
              "--basepath",
              os.environ["FNQ3_VK_RUNTIME_BASEPATH"],
              "--output-dir",
              str(output_dir),
              "--summary-markdown",
              str(summary_path),
          ]

          subprocess.check_call(command)

          github_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if github_summary:
              with open(github_summary, "a", encoding="utf-8") as handle:
                  handle.write(summary_path.read_text(encoding="utf-8"))

      - name: Upload runtime gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulkan-family-runtime-${{ inputs.runtime_gate }}
          path: |
            .tmp/vk-runtime-sweeps
            .tmp/rtx-runtime-smoke
          if-no-files-found: error
          retention-days: 30
